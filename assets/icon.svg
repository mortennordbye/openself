<!-- Concept A: a fingerprint of open-ended arcs, identity that stays open. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="openself">
  <title>openself</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fc1a5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3fc1a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="110" y1="90" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ab8ff"/>
      <stop offset=".45" stop-color="#6aa4f8"/>
      <stop offset="1" stop-color="#3fc1a5"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
  <g fill="none" stroke="url(#ink)" stroke-width="42" stroke-linecap="round" filter="url(#lift)">
    <path d="M216 384 V284 A40 40 0 0 1 296 284 V330"/>
    <path d="M152 420 V284 A104 104 0 0 1 360 284 V372"/>
    <path d="M88 352 V284 A168 168 0 0 1 392 186"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-linecap="round">
    <path d="M222 278 A34 34 0 0 1 248 252"/>
    <path d="M160 270 A96 96 0 0 1 226 190"/>
    <path d="M96 270 A160 160 0 0 1 186 134"/>
  </g>
</svg>
