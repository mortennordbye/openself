name: Release Please

# Opens a release pull request from the Conventional Commit squash commits on main; merging it
# tags vX.Y.Z and publishes a GitHub release. CHANGELOG.md stays hand-written (format changes,
# SPEC section 6), so release notes live in the GitHub releases only.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
