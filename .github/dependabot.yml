version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The docs site's hash-pinned requirements; the library itself has no dependencies.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      docs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
